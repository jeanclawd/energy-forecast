name: daily-forecast

on:
  schedule:
    - cron: "30 5 * * *"        # 05:30 UTC, after RTE has published the night's data
  workflow_dispatch:
    inputs:
      retrain:
        description: "Retrain the models before forecasting"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENERGY_MARKET: ${{ vars.ENERGY_MARKET || 'france' }}
      ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore database and models from the data branch
        run: |
          if git fetch --depth=1 origin data; then
            git checkout FETCH_HEAD -- data models
          else
            echo "no data branch yet: the first run backfills two years of history"
          fi

      - name: Update → (re)train if due → forecast
        run: python -m energy_forecast daily ${{ inputs.retrain && '--retrain' || '' }}

      - name: Publish state to the data branch
        # A single orphan commit, force-pushed: the branch never accumulates history,
        # while the forecast history itself lives inside the database.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan state
          git rm -rfq --cached .
          git add -f data/energy.db models/
          git commit -qm "pipeline state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -fq origin HEAD:data
